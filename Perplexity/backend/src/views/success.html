<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Email Verified — Preplexity</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:Arial,sans-serif;background:#f4f4f4;min-height:100vh;
         display:flex;align-items:center;justify-content:center;padding:2rem 1rem}
    .card{background:#fff;border-radius:12px;padding:48px 40px;
          max-width:460px;width:100%;text-align:center;box-shadow:0 4px 16px rgba(0,0,0,0.08)}
    .icon{width:76px;height:76px;border-radius:50%;background:#EAF3DE;
          display:flex;align-items:center;justify-content:center;margin:0 auto 20px}
    .icon svg{width:38px;height:38px}
    h1{font-size:22px;font-weight:600;color:#111827;margin-bottom:8px}
    p{font-size:15px;color:#6B7280;line-height:1.7;margin-bottom:28px}
    a{display:inline-block;background:#4F46E5;color:#fff;padding:13px 36px;
      border-radius:8px;text-decoration:none;font-size:15px;font-weight:500}
    a:hover{background:#4338CA}
    .footer{margin-top:24px;font-size:12px;color:#9CA3AF}
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="#3B6D11" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
        <polyline points="22 4 12 14.01 9 11.01"/>
      </svg>
    </div>
    <h1>Email Verified!</h1>
    <p>Your email has been successfully verified.<br>You can now log in to your account.</p>
    <a href="/login">Go to Login</a>
    <p class="footer">© 2025 Preplexity · All rights reserved</p>
  </div>
</body>
</html>
