<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Verification Failed — Preplexity</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:Arial,sans-serif;background:#f4f4f4;min-height:100vh;
         display:flex;align-items:center;justify-content:center;padding:2rem 1rem}
    .card{background:#fff;border-radius:12px;padding:48px 40px;
          max-width:460px;width:100%;text-align:center;box-shadow:0 4px 16px rgba(0,0,0,0.08)}
    .icon{width:76px;height:76px;border-radius:50%;background:#FCEBEB;
          display:flex;align-items:center;justify-content:center;margin:0 auto 20px}
    .icon svg{width:38px;height:38px}
    h1{font-size:22px;font-weight:600;color:#111827;margin-bottom:8px}
    p{font-size:15px;color:#6B7280;line-height:1.7;margin-bottom:28px}
    .message{color:#A32D2D;font-weight:500}
    a{display:inline-block;background:#E24B4A;color:#fff;padding:13px 36px;
      border-radius:8px;text-decoration:none;font-size:15px;font-weight:500}
    a:hover{background:#c73c3c}
    .footer{margin-top:24px;font-size:12px;color:#9CA3AF}
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="#A32D2D" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/>
        <line x1="15" y1="9" x2="9" y2="15"/>
        <line x1="9" y1="9" x2="15" y2="15"/>
      </svg>
    </div>
    <h1>Verification Failed</h1>
    <p class="message">{{MESSAGE}}</p>
    <p>Please request a new verification email.</p>
    <a href="http://localhost:5173/register">Resend Email</a>
    <p class="footer">© 2025 Preplexity · All rights reserved</p>
  </div>
</body>
</html>
